<text x="72" y="263" fill="#c7d9e9" font-size="31" font-family="Arial, sans-serif">Clareza para decidir. Apoio para agir.</text>
<text x="72" y="309" fill="#9ab7cc" font-size="22" font-family="Arial, sans-serif">Abrigos, orientação e uma rede de apoio no seu celular.</text>
